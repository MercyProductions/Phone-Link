name: iOS companion

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify SDK and select an installed iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[d["udid"] for runtime,devices in data["devices"].items() if "iOS-26" in runtime for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]; assert matches, "No iOS 26 iPhone simulator installed"; print(matches[0])')"
          printf 'id=%s\n' "$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Boot the selected simulator before testing
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl help bootstatus
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
          xcrun simctl list devices booted
      - name: Build and test the companion
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/PhoneLinkCompanion/PhoneLinkCompanion.xcodeproj \
            -scheme PhoneLinkCompanion \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Collect the test host's own runtime interoperability fixture
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl help get_app_container
          container="$(xcrun simctl get_app_container '${{ steps.simulator.outputs.id }}' com.gabri.PhoneLinkCompanion data)"
          fixture="$container/Library/Caches/PhoneLinkRuntimeFixture"
          test -f "$fixture/runtime.json"
          test -f "$fixture/image.macho"
          mkdir -p artifacts/companion-runtime
          cp "$fixture/runtime.json" artifacts/companion-runtime/runtime.json
          cp "$fixture/image.macho" artifacts/companion-runtime/image.macho
          shasum -a 256 artifacts/companion-runtime/image.macho
          xcrun dwarfdump --uuid artifacts/companion-runtime/image.macho
          xcrun nm artifacts/companion-runtime/image.macho | awk '$NF == "_phonelink_runtime_probe_marker" { print; found=1 } END { exit !found }'
      - name: Preserve own-image runtime fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-runtime-fixture
          path: artifacts/companion-runtime/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: artifacts/ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
