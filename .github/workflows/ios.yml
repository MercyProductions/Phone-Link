name: iOS companion

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify SDK and select an installed iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[d["udid"] for runtime,devices in data["devices"].items() if "iOS-26" in runtime for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]; assert matches, "No iOS 26 iPhone simulator installed"; print(matches[0])')"
          printf 'id=%s\n' "$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build and test the companion
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/PhoneLinkCompanion/PhoneLinkCompanion.xcodeproj \
            -scheme PhoneLinkCompanion \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath artifacts/ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: artifacts/ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
